title: WM Slides
author: Weverthon Machado
version: 1.2.0
quarto-required: ">=1.2.0"
contributes:
  formats:
    revealjs:
      theme: [dark, custom.scss]
      filters: [custom.lua, typst-embed.lua]
      template-partials:
        - title-slide.html
      title-slide-attributes:
        data-background-image: logo.png
        data-background-position: 90% 80%
        data-background-size: 25%
      include-after-body: pdf-internal-links.html

